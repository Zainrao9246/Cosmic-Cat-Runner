# Build Cosmo Cat Run for Android (.apk) on every push.
#
# What you get from a run of this workflow:
#   1. An artifact "cosmo-cat-run-android" (downloadable from the Actions tab)
#   2. On every tag push (v1.0, v1.1, ...) the .apk is attached to a Release,
#      next to the Windows .exe.
#
# How it works: Android apps are native libraries + gradle packaging. The
# workflow clones raylib into android/app/jni/raylib, copies the game source
# and assets into the Android project, then runs gradle (which drives the
# NDK ndk-build) to produce the .apk. The game is the same single main.cpp
# the desktop build uses; the Android glue (activity lifecycle, input,
# asset manager) is provided by raylib itself (rcore_android.c).
#
# Fixes applied (Nov 2026):
#   - setup-android@v3: set packages: '' — its default 'tools platform-tools'
#     tries to install the obsolete 'tools' package which no longer exists in
#     Google's SDK repo ("Failed to find package 'tools'", exit code 1).
#   - setup-java@v5 (v4 is deprecated).
#   - setup-gradle@v4 with gradle pinned to 8.9 (AGP 8.5.2 needs Gradle 8.7+
#     and is incompatible with Gradle 9.x that newer runners may ship).
#   - main_android.c removed from the build: raylib (PLATFORM_ANDROID)
#     already defines android_main() — a second definition fails to link.
#   - Assets load via raylib's AAssetManager ("assets/..." relative paths);
#     handled in main.cpp LoadAssetTex() with an __ANDROID__ branch.

name: Build Android .apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17 (gradle needs it)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # default ('tools platform-tools') fails: 'tools' no longer exists

      - name: Install the NDK (native code compiler)
        run: sdkmanager --install "ndk;26.1.10909125" > /dev/null

      - name: Clone raylib 5.5 into the Android project
        run: git clone --depth 1 --branch 5.5
             https://github.com/raysan5/raylib.git
             android/app/src/main/jni/raylib
             
      - name: Copy the game source + assets into the Android project
        run: |
          cp src/main.cpp android/app/src/main/jni/main.cpp
          mkdir -p android/app/src/main/assets/assets
          cp -r assets/* android/app/src/main/assets/assets/

      - name: Patch the Android project files (safety nets)
        run: python3 .github/workflows/patch_android.py

      - name: Install Gradle 8.9 (compatible with AGP 8.5.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the .apk
        run: gradle -p android assembleDebug --no-daemon

      - name: Give the .apk a friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cosmo-cat-run.apk

      - name: Upload .apk as artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: cosmo-cat-run-android
          path: cosmo-cat-run.apk

      - name: Attach .apk to a Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cosmo-cat-run.apk
